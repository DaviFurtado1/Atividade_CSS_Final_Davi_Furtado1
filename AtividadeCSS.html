<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade CSS</title>
    <style>
        .hh {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        img {
            width: 300px;
            height: 200px;

        }

        * {
            text-align: center;
        }

        .e2 {
            text-align: center;
            color: salmon;
        }

        .color {
            background-color: lightblue;
        }

        .purple {
            color: magenta;
        }

        .green {
            color: green border: 1px solid;
            margin: 0px;
        }

        div {
            border: 1px solid;
            border-color: rgb(255, 145, 0);
            margin: 0px
        }

        .pp2 {
            color: green;
            font-family: 'Times New Roman', Times, serif;
            text-decoration: underline;
            text-align: center;
        }

        .h33 {
            background-color: purple;
            color: orange;
            text-decoration: underline;
            font-family: 'Times New Roman', Times, serif;
            font-size: 50px;
            border: 1px solid;
            font-style: italic;
        }

        .hr {
            border: 10px solid;
            color: black;
            height: 1px;
        }
    </style>
</head>

<body>
    <h1 clas="hh">PÁGINA TESTE CSS</h1>
    <hr class="hr">
    <img src="_img/css01.jpg" alt="css">
    <img src="_img/css02.jpg" alt="CSS 2">
    <img src="_img/css03.png" alt="CSS 3">
    <img src="_img/css04.png" alt="CSS 4">
    <hr class="hr">
    <h1 class="e2">CSS È VIDA!</h1>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <h1>Exemplo de Cores no CSS</h1>
    <p class="color"><b>Exemplo de texto com cor de fundo</b></p>
    <hr class="hr">
    <p class="purple">Exemplo de texto com mudança de cor da fonte</p>
    <hr class="hr">
    <div>
        <h1 class="green">
            Exemplo de texto com borda colorida
        </h1>
    </div>

    <h1>MISTURANDO TUDO</h1>

    <Div>
        <p class="pp2"> Exemplo de texto com várias formatações</p>
    </Div>
    <hr class="hr">
    <h1 class="h33">Mais um exemplo</h1>



    <!-- oi -->
</body>

</html>
